schema_version: 1

harbor:
  task_source: evals_json
  n_attempts: 1
  n_concurrent: 1
  max_agents: 1
  stop_on_pass: false
  timeout_multiplier: 6
  auto_scale_timeout: true
  sandbox:
    templates:
      claude-code: harbor-eval-dali-gpu-claude-code
      codex: harbor-eval-dali-gpu-codex
  pre_agent_setup:
    - cp -a /opt/eval/workloads /workspace/workloads
